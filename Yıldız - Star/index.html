<!DOCTYPE html>
<html lang="tr">
<head>
    <meta name="description" content="Yıldız" />
    <meta name="keywords" content="html, css, js, yıldız, star" />
    <meta name="author" content="Nihat ALIYEV" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111;
            font-family: sans-serif;
        }
        h1 {
            color: #fff;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            font-weight: 300;
            letter-spacing: 2px;
        }
        svg {
            width: 160px;
            height: 160px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1)); }
        }
    </style>
</head>
<body>
    <h1>Yıldız</h1>
    <svg viewBox="0 0 200 200">
        <polygon points="100,10 40,198 190,78 10,78 160,198" fill="gold" stroke="#fff" stroke-width="2"></polygon>
    </svg>
</body>
</html>
